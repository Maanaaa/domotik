services:
  nextjs:
    build:
      context: ./domotik
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3001}:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - WATCHPACK_POLLING=true
      - MQTT_BROKER_URL=mqtt://host.docker.internal:1883
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
    networks:
      - proxy

networks:
  proxy:
    name: proxy_network
    external: true
